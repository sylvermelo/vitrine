name: Publier la vitrine sur Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-vitrine
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la connexion Cloudflare
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Ajouter CLOUDFLARE_API_TOKEN aux secrets du dépôt"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Ajouter CLOUDFLARE_ACCOUNT_ID aux secrets du dépôt"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publier les fichiers statiques
        run: npx --yes wrangler@4 pages deploy docs --project-name pronos-foot-vitrine --branch main
